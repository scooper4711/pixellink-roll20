sonar.projectKey=scooper4711_pixellink-roll20
sonar.organization=scooper4711

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.js,**/*.test.ts
# Experimental scratch tests are excluded from Jest runs
# (see testPathIgnorePatterns in package.json), so keep them out of analysis too.
sonar.test.exclusions=tests/jest/experimental/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.js
